name: Build lmdb
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: lmdb tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout lmdb
        uses: actions/checkout@v5
        with:
          path: lmdb
          repository: winlibs/lmdb
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{steps.virtuals.outputs.toolset}}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Build lmdb
        run: cd lmdb\libraries\liblmdb && nmake /f Makefile.vc
      - name: Install lmdb
        run: |
          cd lmdb\libraries\liblmdb
          xcopy *.exe ..\..\..\build\bin\*
          xcopy lmdb.h ..\..\..\build\include\*
          xcopy liblmdb_a.* ..\..\..\build\lib\*
      - name: Copy license files
        run: |
          xcopy lmdb\libraries\liblmdb\COPYRIGHT build\share\licenses\liblmdb\libraries\liblmdb\*
          xcopy lmdb\libraries\liblmdb\LICENSE build\share\licenses\liblmdb\libraries\liblmdb\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library lmdb
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'build'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: build
