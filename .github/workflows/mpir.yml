name: Build mpir
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: mpir tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout mpir
        uses: actions/checkout@v5
        with:
          path: mpir
          repository: winlibs/mpir
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Setup msbuild
        if: matrix.arch != 'arm64'
        uses: microsoft/setup-msbuild@v2
      - name: Build mpir
        run: cd mpir && msbuild /p:Configuration=Release;Platform=${{steps.virtuals.outputs.msarch}};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}} build.vc${{steps.virtuals.outputs.vsnum}}\lib_mpir_gc\lib_mpir_gc.vcxproj
      - name: Install mpir
        run: |
          cd mpir
          xcopy lib\${{steps.virtuals.outputs.msarch}}\Release\config.h ..\install\include\mpir\*
          xcopy lib\${{steps.virtuals.outputs.msarch}}\Release\gmp-mparam.h ..\install\include\mpir\*
          xcopy lib\${{steps.virtuals.outputs.msarch}}\Release\gmp.h ..\install\include\mpir\*
          xcopy lib\${{steps.virtuals.outputs.msarch}}\Release\mpir.h ..\install\include\mpir\*
          xcopy build.vc${{steps.virtuals.outputs.vsnum}}\lib_mpir_gc\${{steps.virtuals.outputs.msarch}}\Release\mpir_a.??? ..\install\lib\*
      - name: Copy license files
        run: |
          xcopy mpir\COPYING install\share\licenses\mpir\*
          xcopy mpir\COPYING.LIB install\share\licenses\mpir\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library mpir
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
