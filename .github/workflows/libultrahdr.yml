name: Build libultrahdr
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: libultrahdr tag to build
        required: true
        default: libultrahdr-1.4.0
      php:
        description: PHP version to build for
        required: true
        default: '8.6'
      stability:
        description: the series stability
        required: false
        default: staging
      workflow_run_ids:
        description: Comma-separated winlib-builder workflow run IDs to download dependency artifacts from
        required: false
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout libultrahdr
        uses: actions/checkout@v5
        with:
          path: libultrahdr
          repository: winlibs/libultrahdr
          ref: ${{ github.event.inputs.version }}
      - name: Patch libultrahdr
        run: cd libultrahdr && git apply --ignore-whitespace ..\winlib-builder\patches\libultrahdr.patch
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{ github.event.inputs.php }} -arch ${{ matrix.arch }} -sdk ${{ matrix.sdk }}
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Fetch dependencies
        run: powershell winlib-builder/scripts/fetch-deps -lib libultrahdr -version ${{ inputs.php }} -vs ${{ steps.virtuals.outputs.vs }} -arch ${{ matrix.arch }} -stability ${{ inputs.stability }} -workflow_run_ids:'${{ inputs.workflow_run_ids }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize CMake paths
        run: echo CMAKE_WORKSPACE=%GITHUB_WORKSPACE:\=/%>>"%GITHUB_ENV%"
      - name: Configure libultrahdr
        run: >-
          cmake -S libultrahdr -B libultrahdr\build-static
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_FOR_WINUI=ON
          -DUHDR_BUILD_EXAMPLES=OFF
          -DUHDR_BUILD_TESTS=OFF
          -DUHDR_BUILD_BENCHMARK=OFF
          -DUHDR_BUILD_FUZZERS=OFF
          -DUHDR_BUILD_DEPS=OFF
          -DUHDR_BUILD_JAVA=OFF
          -DUHDR_BUILD_PACKAGING=OFF
          -DUHDR_ENABLE_INSTALL=OFF
          -DUHDR_ENABLE_GLES=OFF
          -DUHDR_ENABLE_WERROR=OFF
          -DUHDR_WRITE_XMP=OFF
          -DUHDR_WRITE_ISO=ON
          -DJPEG_INCLUDE_DIR="%CMAKE_WORKSPACE%/deps/include"
          -DJPEG_LIBRARY="%CMAKE_WORKSPACE%/deps/lib/libjpeg_a.lib"
          -DJPEG_LIBRARY_RELEASE="%CMAKE_WORKSPACE%/deps/lib/libjpeg_a.lib"
      - name: Build libultrahdr
        run: |
          cmake --build libultrahdr\build-static --config RelWithDebInfo
          if errorlevel 1 exit /b %errorlevel%
      - name: Stage libultrahdr
        run: |
          mkdir install\include
          mkdir install\lib
          copy /Y libultrahdr\ultrahdr_api.h install\include\
          copy /Y libultrahdr\build-static\uhdr_a.lib install\lib\
          copy /Y libultrahdr\build-static\uhdr_core.pdb install\lib\
          copy /Y libultrahdr\build-static\uhdr_image_io.pdb install\lib\
      - name: Verify libultrahdr artifacts
        run: |
          if not exist install\include\ultrahdr_api.h exit /b 1
          if not exist install\lib\uhdr_a.lib exit /b 1
          if not exist install\lib\uhdr_core.pdb exit /b 1
          if not exist install\lib\uhdr_image_io.pdb exit /b 1
          cl /nologo /W3 /MD /Zi /Fdcheck-libultrahdr-static-compile.pdb /Iinstall\include winlib-builder\.github\ci\check-libultrahdr.c /link /DEBUG /WX /PDB:check-libultrahdr-static.pdb /LIBPATH:install\lib /LIBPATH:deps\lib uhdr_a.lib libjpeg_a.lib /OUT:check-libultrahdr-static.exe
          if errorlevel 1 exit /b %errorlevel%
          check-libultrahdr-static.exe
      - name: Copy license files
        run: xcopy libultrahdr\LICENSE install\share\licenses\libultrahdr\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library libultrahdr
          -Version '${{ inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-${{ steps.virtuals.outputs.vs }}-${{ matrix.arch }}
          path: install
