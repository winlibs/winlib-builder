name: Build cyrus-sasl
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: cyrus-sasl tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
      stability:
        description: the series stability
        required: false
        default: 'staging'
      workflow_run_ids:
        description: Comma-separated winlib-builder workflow run IDs to download dependency artifacts from
        required: false
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout cyrus-sasl
        uses: actions/checkout@v5
        with:
          path: cyrus-sasl
          repository: winlibs/cyrus-sasl
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Fetch dependencies
        run: powershell winlib-builder/scripts/fetch-deps -lib cyrus-sasl -version ${{github.event.inputs.php}} -vs ${{steps.virtuals.outputs.vs}} -arch ${{matrix.arch}} -stability ${{github.event.inputs.stability}} -workflow_run_ids:'${{github.event.inputs.workflow_run_ids}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup msbuild
        if: matrix.arch != 'arm64'
        uses: microsoft/setup-msbuild@v2
      - name: Build cyrus-sasl-core
        run: cd cyrus-sasl\win32 && msbuild /p:Configuration=Release;Platform=${{ matrix.arch == 'arm64' && 'ARM64' || matrix.arch }};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}} cyrus-sasl-core.sln
      - name: Build cyrus-sasl-sasldb
        run: cd cyrus-sasl\win32 && msbuild /p:Configuration=Release;Platform=${{ matrix.arch == 'arm64' && 'ARM64' || matrix.arch }};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}} cyrus-sasl-sasldb.sln
      - name: Install cyrus-sasl
        run: |
          cd cyrus-sasl\win32
          set platform=${{steps.virtuals.outputs.msarch}}
          xcopy %platform%\Release\libsasl.dll ..\..\install\bin\*
          xcopy %platform%\Release\libsasl.pdb ..\..\install\bin\*
          xcopy %platform%\Release\plugin_sasldb.dll ..\..\install\bin\sasl2\*
          xcopy %platform%\Release\plugin_sasldb.pdb ..\..\install\bin\sasl2\*
          xcopy ..\include\*.h ..\..\install\include\sasl\*
          xcopy include\md5global.h ..\..\install\include\sasl\*
          xcopy %platform%\Release\libsasl.lib ..\..\install\lib\*
      - name: Copy license files
        run: xcopy cyrus-sasl\COPYING install\share\licenses\libsasl\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library cyrus-sasl
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
