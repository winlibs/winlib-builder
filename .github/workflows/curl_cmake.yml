name: Build curl with cmake
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: curl tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
      stability:
        description: the series stability
        required: false
        default: 'staging'
      workflow_run_ids:
        description: Comma-separated winlib-builder workflow run IDs to download dependency artifacts from
        required: false
      smb_support:
        description: Enable SMB/SMBS (requires a source tag with SMB support)
        type: boolean
        required: false
        default: true
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v4
        with:
          path: winlib-builder
      - name: Checkout curl
        uses: actions/checkout@v4
        with:
          path: curl
          repository: winlibs/curl
          ref: ${{github.event.inputs.version}}
      - name: Patch curl
        run: cd curl && git apply --ignore-whitespace ..\winlib-builder\patches\curl.patch
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Fetch dependencies
        run: powershell winlib-builder/scripts/fetch-deps -lib curl -version ${{github.event.inputs.php}} -vs ${{steps.virtuals.outputs.vs}} -arch ${{matrix.arch}} -stability ${{github.event.inputs.stability}} -workflow_run_ids:'${{github.event.inputs.workflow_run_ids}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{steps.virtuals.outputs.toolset}}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Configure curl
        run: |
          cd curl
          cmake -G "Visual Studio ${{steps.virtuals.outputs.vsinst}}" -A ${{steps.virtuals.outputs.msarch}}^
            -T ${{steps.virtuals.outputs.msts}} -DCMAKE_SYSTEM_VERSION=${{steps.virtuals.outputs.winsdk}}^
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_STATIC_CURL=ON -DSHARE_LIB_OBJECT=OFF -DBUILD_LIBCURL_DOCS=OFF^
            -DCMAKE_INCLUDE_PATH:PATH=%GITHUB_WORKSPACE%\deps\include;%GITHUB_WORKSPACE%\deps\include\libssh2^
            -DCMAKE_LIBRARY_PATH:PATH=%GITHUB_WORKSPACE%\deps\lib^
            -DCMAKE_PROJECT_INCLUDE:FILEPATH=%GITHUB_WORKSPACE%\winlib-builder\cmake\php-sdk-library-suffixes.cmake^
            -DCURL_BROTLI=ON^
            -DCURL_USE_LIBPSL=OFF^
            -DUSE_WIN32_IDN=ON^
            -DCURL_WINDOWS_SSPI=ON^
            -DCURL_ENABLE_NTLM=ON^
            -DCURL_ENABLE_SMB=${{ inputs.smb_support && 'ON' || 'OFF' }}^
            -DCURL_DISABLE_MQTT=ON^
            -DCURL_USE_OPENSSL=ON^
            -DCURL_ZSTD=ON^
            -DZSTD_USE_STATIC_LIBS=ON^
            -DZSTD_LIBRARY:FILEPATH=%GITHUB_WORKSPACE%\deps\lib\libzstd_a.lib^
            .
      - name: Build curl
        run: cd curl && cmake --build . --config RelWithDebInfo
      - name: Install curl
        run: |
          cd curl
          cmake --install . --config RelWithDebInfo --prefix %GITHUB_WORKSPACE%\install
          copy src\RelWithDebInfo\curl.pdb %GITHUB_WORKSPACE%\install\bin\*
          copy lib\RelWithDebInfo\libcurl_a.pdb %GITHUB_WORKSPACE%\install\lib\*
          del %GITHUB_WORKSPACE%\install\bin\curl-config
          del %GITHUB_WORKSPACE%\install\bin\mk-ca-bundle.pl
          rd /s /q %GITHUB_WORKSPACE%\install\share
      - name: Patch libcurl
        run: |
          cd %GITHUB_WORKSPACE%\install\lib
          ren libcurl_a.lib libcurl_static.lib
          lib /OUT:libcurl_a.lib libcurl_static.lib %GITHUB_WORKSPACE%\deps\lib\libzstd_a.lib secur32.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          del libcurl_static.lib
      - name: Verify built protocols
        shell: pwsh
        env:
          SMB_SUPPORT: ${{ inputs.smb_support }}
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\deps\bin;$env:PATH"
          $version = & .\install\bin\curl.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The built curl executable failed to start.' }
          $version | Write-Output
          $protocols = @((($version | Where-Object { $_ -match '^Protocols:' }) -replace '^Protocols:\s*', '') -split '\s+')
          if ($env:SMB_SUPPORT -eq 'true') {
            if ('smb' -notin $protocols -or 'smbs' -notin $protocols) {
              throw 'The built curl must support both SMB and SMBS.'
            }
          } elseif ('smb' -in $protocols -or 'smbs' -in $protocols) {
            throw 'The built curl unexpectedly supports SMB or SMBS.'
          }
      - name: Copy license files
        run: xcopy curl\COPYING install\share\licenses\libcurl\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library curl
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
