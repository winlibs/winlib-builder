name: Build argon2
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: argon2 tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout argon2
        uses: actions/checkout@v5
        with:
          path: argon2
          repository: winlibs/argon2
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{steps.virtuals.outputs.toolset}}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Patch ARM64 debug information
        if: matrix.arch == 'arm64'
        run: cd argon2 && git apply --ignore-whitespace ..\winlib-builder\patches\argon2-arm64.patch
      - name: Build argon2
        run: |
          cd argon2
          nmake /f Makefile.vc
          nmake /f Makefile.vc DEBUG=1
      - name: Install argon2
        run: |
          cd argon2
          xcopy include\*.h ..\install\include\*
          xcopy argon2_a*.lib ..\install\lib\*
          xcopy argon2_a*.pdb ..\install\lib\*
      - name: Copy license files
        run: xcopy argon2\LICENSE install\share\licenses\argon2\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library argon2
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
