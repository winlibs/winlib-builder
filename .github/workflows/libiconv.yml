name: Build libiconv
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: libiconv tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout libiconv
        uses: actions/checkout@v5
        with:
          path: libiconv
          repository: winlibs/libiconv
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{steps.virtuals.outputs.toolset}}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Setup msbuild
        if: matrix.arch != 'arm64'
        uses: microsoft/setup-msbuild@v2
      - name: Patch VS16 ARM64 output paths and required ASLR
        if: matrix.arch == 'arm64' && steps.virtuals.outputs.vs == 'vs16'
        run: git -C libiconv apply --ignore-whitespace ../winlib-builder/patches/libiconv-vs16-arm64.patch
      - name: Build libiconv
        run: cd libiconv\MSVC${{steps.virtuals.outputs.vsnum}} && msbuild libiconv.sln /p:Configuration=Release /p:Platform=${{steps.virtuals.outputs.msarch}} /p:PlatformToolset=${{steps.virtuals.outputs.msts}} /p:WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}}
      - name: Install libiconv
        run: |
          cd libiconv\MSVC${{steps.virtuals.outputs.vsnum}}
          xcopy ${{steps.virtuals.outputs.msarch}}\bin\*.dll ..\..\install\bin\*
          xcopy ${{steps.virtuals.outputs.msarch}}\bin\*.pdb ..\..\install\bin\*
          xcopy ..\source\include\iconv.h ..\..\install\include\*
          xcopy ${{steps.virtuals.outputs.msarch}}\lib\*.lib ..\..\install\lib\*
          xcopy ${{steps.virtuals.outputs.msarch}}\lib\*.pdb ..\..\install\lib\*
      - name: Copy license files
        run: |
          xcopy libiconv\source\COPYING install\share\licenses\libiconv\source\*
          xcopy libiconv\source\COPYING.LIB install\share\licenses\libiconv\source\*
          xcopy libiconv\source\libcharset\COPYING.LIB install\share\licenses\libiconv\source\libcharset\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library libiconv
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
