name: Build net-snmp
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: net-snmp tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
      stability:
        description: the series stability
        required: false
        default: 'staging'
      workflow_run_ids:
        description: Comma-separated winlib-builder workflow run IDs to download dependency artifacts from
        required: false
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout net-snmp
        uses: actions/checkout@v5
        with:
          path: net-snmp
          repository: winlibs/net-snmp
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Fetch dependencies
        run: powershell winlib-builder/scripts/fetch-deps -lib net-snmp -version ${{github.event.inputs.php}} -vs ${{steps.virtuals.outputs.vs}} -arch ${{matrix.arch}} -stability ${{github.event.inputs.stability}} -workflow_run_ids:'${{github.event.inputs.workflow_run_ids}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{steps.virtuals.outputs.toolset}}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Patch ARM64 Windows types and byte order
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}' -replace '^net-snmp-', ''
          $branch = if ($version.StartsWith('5.7.')) { '5.7' } elseif ($version.StartsWith('5.9.4')) { '5.9.4' } else { '5.9.5' }
          git -C net-snmp apply --ignore-whitespace "../winlib-builder/patches/net-snmp-$branch-arm64.patch"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure net-snmp
        run: cd net-snmp\win32 && perl Configure --with-sdk --with-ssl --config=release --linktype=static --with-ipv6 --prefix=c:/usr
      - name: Build libsnmp
        run: cd net-snmp\win32 && set INCLUDE=${{github.workspace}}\deps\include;%INCLUDE% && nmake libsnmp
      - name: Build libagent
        run: cd net-snmp\win32 && set INCLUDE=${{github.workspace}}\deps\include;%INCLUDE% && nmake libagent
      - name: Build netsnmpmibs
        run: cd net-snmp\win32 && set INCLUDE=${{github.workspace}}\deps\include;%INCLUDE% && nmake netsnmpmibs
      - name: Build snmpd
        run: cd net-snmp\win32 && set INCLUDE=${{github.workspace}}\deps\include;%INCLUDE% && xcopy ${{github.workspace}}\deps\lib\*.lib lib\release && nmake snmpd
      - name: Install net-snmp
        run: |
          cd net-snmp
          xcopy win32\bin\release\snmpd.exe ..\install\bin\*
          xcopy win32\bin\release\snmpd.pdb ..\install\bin\*
          xcopy /e include\net-snmp\*.h ..\install\include\net-snmp\*
          xcopy /e win32\net-snmp\*.h ..\install\include\net-snmp\*
          xcopy include\net-snmp\library\README ..\install\include\net-snmp\library\*
          xcopy win32\lib\release\netsnmp.lib ..\install\lib\*
          xcopy win32\libsnmp\release\libsnmp.pdb ..\install\lib\*
          xcopy mibs\* ..\install\share\mibs\*
      - name: Verify snmptrapd code is excluded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-ChildItem install -Recurse -File -Filter '*snmptrapd*') {
            throw 'snmptrapd is packaged; review the CVE-2025-68615 VEX disposition.'
          }
          $symbols = & dumpbin /nologo /linkermember:1 install/lib/netsnmp.lib
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect netsnmp.lib symbols.' }
          if (($symbols -join "`n") -match '(?m)\b_?snmp_input(?:@\d+)?\s*$') {
            throw 'The snmptrapd input handler is linked; review the CVE-2025-68615 VEX disposition.'
          }
          Write-Host 'Verified snmptrapd and its vulnerable input handler are absent.'
      - name: Copy license files
        run: xcopy net-snmp\COPYING install\share\licenses\net-snmp\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library net-snmp
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
