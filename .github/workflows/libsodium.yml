name: Build libsodium
run-name: "Build ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: libsodium tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
defaults:
  run:
    shell: cmd
jobs:
  matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      php: ${{ inputs.php }}
  build:
    name: build ${{ matrix.arch }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout libsodium
        uses: actions/checkout@v5
        with:
          path: libsodium
          repository: winlibs/libsodium
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}} -sdk ${{ matrix.sdk }}
      - name: Setup MSVC development environment
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.msvc_sdk }}
      - name: Setup msbuild
        if: matrix.arch != 'arm64'
        uses: microsoft/setup-msbuild@v2
      - name: Build libsodium
        run: cd libsodium\builds\msvc\vs${{ matrix.arch == 'arm64' && '2022' || steps.virtuals.outputs.vsyear }} && msbuild /t:Rebuild /p:Configuration=StaticRelease;Platform=${{steps.virtuals.outputs.msarch}};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}} libsodium.sln && msbuild /t:Rebuild /p:Configuration=DynRelease;Platform=${{steps.virtuals.outputs.msarch}};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}} libsodium.sln
      - name: Install libsodium
        run: |
          cd libsodium
          set platform=${{steps.virtuals.outputs.msarch}}
          set toolset=${{steps.virtuals.outputs.msts}}
          xcopy bin\%platform%\Release\%toolset%\dynamic\libsodium.dll ..\install\bin\*
          xcopy bin\%platform%\Release\%toolset%\dynamic\libsodium.pdb ..\install\bin\*
          xcopy /e src\libsodium\include\*.h ..\install\include\*
          rmdir /s /q ..\install\include\sodium\private
          del ..\install\include\sodium\randombytes_nativeclient.h
          xcopy bin\%platform%\Release\%toolset%\dynamic\libsodium.lib ..\install\lib\*
          copy bin\%platform%\Release\%toolset%\static\libsodium.lib ..\install\lib\libsodium_a.lib
      - name: Copy license files
        run: xcopy libsodium\LICENSE install\share\licenses\libsodium\*
      - name: Generate SBOMs
        shell: pwsh
        run: >
          .\winlib-builder\scripts\generate-sbom.ps1
          -Library libsodium
          -Version '${{ github.event.inputs.version }}'
          -InstallRoot 'install'
          -Vs '${{ steps.virtuals.outputs.vs }}'
          -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ github.event.inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
